# This file configures the static analysis results for this project (errors,
# warnings, and lints).
#
# `package:lints/recommended.yaml` is the Dart team's baseline and includes the
# core lints that pub.dev scores packages against. The rules below tighten the
# types the analyzer accepts without changing the baseline's style opinions.

include: package:lints/recommended.yaml

analyzer:
  language:
    strict-inference: true
  errors:
    # This project writes single-line `if` bodies deliberately.
    curly_braces_in_flow_control_structures: ignore
    annotate_overrides: ignore

linter:
  rules:
    # Keep class declarations concise now that Dart 3.13 primary constructors
    # are available.
    - empty_container_bodies
    - initialize_in_field_declaration
    - unnecessary_primary_constructor_body
    - unnecessary_type_name_in_constructor
    - use_declaring_parameters
    # A bare generic is an implicit `dynamic`, and an implicit `dynamic` cast
    # fails at runtime. Both are spelled out instead.
    - no_dynamic_casts
    - no_raw_types
    - strict_top_level_inference

# For more information about the core and recommended set of lints, see
# https://dart.dev/go/core-lints

# For additional information about configuring this file, see
# https://dart.dev/tools/analysis
