name: Set up supported Bash
description: Select Bash 4 or newer on PATH and fail if the requirement is unmet.
runs:
  using: composite
  steps:
    # Use POSIX sh to bootstrap; macOS's system Bash is not a test target.
    - name: Install supported Bash on macOS
      if: runner.os == 'macOS'
      shell: sh
      run: |
        brew install bash
        echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
    - name: Require Bash 4 or newer
      shell: sh
      run: sh "$GITHUB_ACTION_PATH/verify.sh"
