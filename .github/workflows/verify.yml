name: Verify

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bash
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test --coverage=.dart_tool/coverage
      - name: Compile and execute Dart documentation examples
        run: dart run tool/check_examples.dart
      - name: Collect coverage
        run: |
          dart run coverage:format_coverage \
            --lcov \
            --check-ignore \
            --in=.dart_tool/coverage \
            --out=.dart_tool/coverage.lcov \
            --report-on=lib \
            --packages=.dart_tool/package_config.json
      # Every measurable line is covered, and the four blocks that are not are
      # annotated in the source with why a parent VM cannot see them. A line
      # that loses coverage fails the build rather than quietly shrinking the
      # denominator.
      - name: Fail on an uncovered line
        run: |
          missed=$(grep -c '^DA:[0-9]*,0$' .dart_tool/coverage.lcov || true)
          if [ "$missed" != "0" ]; then
            echo "::error::$missed measurable lines are not covered"
            grep '^DA:[0-9]*,0$' .dart_tool/coverage.lcov | head -20
            exit 1
          fi
          echo "every measurable line is covered"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .dart_tool/coverage.lcov

  generated-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bash
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      # A stale fixture is a defect in its own right: the checked-in
      # completions are what users install.
      - name: Fail when a completion artifact is stale
        run: |
          dart run tool/regenerate_fixtures.dart
          if ! git diff --quiet -- fixtures/rig/completions; then
            echo '::error::completion artifacts are stale, run dart run tool/regenerate_fixtures.dart'
            git diff --stat -- fixtures/rig/completions
            exit 1
          fi

  shells:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bash
        if: runner.os != 'Windows'
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      # Every shell a generated artifact targets must at least accept what the
      # generator writes. Windows PowerShell's own parser is the strictest of
      # these checks and is the one that caught duplicate command names, so the
      # matrix has to actually reach a Windows runner for it to mean anything.
      - name: Install zsh and fish on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish
      - name: Install fish on macOS
        if: runner.os == 'macOS'
        run: brew install fish
      # The versions the artifacts are checked against, printed so a support
      # claim in the README is backed by a run rather than by memory.
      - name: Record the shells this run verified
        if: runner.os != 'Windows'
        run: |
          bash --version | head -1
          zsh --version
          fish --version
      - name: Record PowerShell on Windows
        if: runner.os == 'Windows'
        run: |
          Get-Command pwsh, powershell.exe -ErrorAction Stop
          pwsh --version
          powershell.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: Drive real Windows PowerShell and pwsh completion isolation
        if: runner.os == 'Windows'
        run: dart test test/completion_shell_test.dart --name PowerShell --reporter=expanded
      - uses: actions/setup-python@v6
        if: runner.os == 'Windows'
        with:
          python-version: '3.13'
      - name: Install Windows terminal test transport
        if: runner.os == 'Windows'
        run: python -m pip install pywinpty==3.0.5
      - name: Drive Clix-backed components through a real Windows console
        if: runner.os == 'Windows'
        run: python tool/check_clix_terminal.py
      - name: Check Clix-backed component behavior and generated code
        run: dart test test/components_test.dart test/clix_prompts_test.dart test/clix_process_test.dart test/component_codegen_test.dart
      - name: Drive a real bash completion
        if: runner.os != 'Windows'
        run: dart test test/completion_shell_test.dart --reporter=expanded
      - name: Check every script the local shell can parse
        run: dart test test/integrations_test.dart
      - name: Parse the checked-in Bash artifact
        if: runner.os != 'Windows'
        run: bash -n fixtures/rig/completions/rig.bash
      - name: Parse the checked-in zsh artifact
        if: runner.os != 'Windows'
        run: zsh -n fixtures/rig/completions/_rig
      - name: Parse the checked-in fish artifact
        if: runner.os != 'Windows'
        run: fish --no-execute fixtures/rig/completions/rig.fish

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bash
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm test
      - run: pnpm build