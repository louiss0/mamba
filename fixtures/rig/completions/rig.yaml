          - "thumbnails"
          - "thumbnails"
          - "downloads"
          - "downloads"
          - "trash"
          - "trash"
        - - "cache"
          - "cache"
          - "logs"
          - "logs"
          - "temp"
          - "temp"
          - "thumbnails"
          - "thumbnails"
          - "downloads"
          - "downloads"
          - "trash"
          - "trash"
        - - "cache"
          - "cache"
          - "logs"
          - "logs"
          - "temp"
          - "temp"
          - "thumbnails"
          - "thumbnails"
          - "downloads"
          - "downloads"
          - "trash"
          - "trash"
  - name: "completion"
    description: |-
      Generate a completion artifact without writing files.
      
      Print a generated completion artifact to standard output. The command
      never writes files; redirect its output explicitly if desired.
    flags:
      -h, --help: "Show this help message."
      --shell?=:
        description: "Completion artifact format to print to stdout."
        default: "carapace"
    completion:
      flag:
        shell:
          - "carapace"
          - "bash"
          - "fish"
          - "zsh"
          - "powershell"
  - name: "network"
    description: "Organize simulated networking commands; no traffic is sent."
    aliases:
      - "net"
    flags:
      -h, --help: "Show this help message."
    commands:
      - name: "wifi"
        description: "Describe simulated Wi-Fi operations."
        flags:
          -h, --help: "Show this help message."
        commands:
          - name: "connect"
            description: "Describe connecting to a simulated Wi-Fi network."
            flags:
              -h, --help: "Show this help message."
              --hidden: "Describe a hidden simulated network."
              --ssid!=: "Simulated network name."
              --password?=: "Masked simulated password; it is never printed."
              --channel?=: "Simulated Wi-Fi channel."
            completion:
              flag:
                channel:
                  - "$carapace.number.Range({start: 1, end: 196})"
          - name: "disconnect"
            description: "Describe disconnecting from a simulated Wi-Fi network."
            flags:
              -h, --help: "Show this help message."
              --ssid?=: "Optional simulated network name."
          - name: "scan"
            description: "Describe scanning simulated Wi-Fi results."
            flags:
              -h, --help: "Show this help message."
              --hidden: "Include hidden simulated networks."
              --channel?=: "Optional simulated channel filter."
            completion:
              flag:
                channel:
                  - "$carapace.number.Range({start: 1, end: 196})"
          - name: "status"
            description: "Describe simulated Wi-Fi status."
            flags:
              -h, --help: "Show this help message."
      - name: "dns"
        description: "Describe simulated DNS configuration."
        flags:
          -h, --help: "Show this help message."
        commands:
          - name: "get"
            description: "Show fixed simulated DNS configuration."
            flags:
              -h, --help: "Show this help message."
              --interface?=: "Simulated network interface."
          - name: "set"
            description: "Describe configuring simulated DNS servers."
            flags:
              -h, --help: "Show this help message."
              --interface?=: "Simulated network interface."
              --server*!=: "Repeatable simulated DNS server in preserved order."
          - name: "reset"
            description: "Describe restoring simulated DNS defaults."
            flags:
              -h, --help: "Show this help message."
              --interface?=: "Simulated network interface."
      - name: "proxy"
        description: "Describe simulated HTTP, HTTPS, and SOCKS proxy settings."
        flags:
          -h, --help: "Show this help message."
          --http.host?=: "HTTP proxy host."
          --http.port?=: "HTTP TCP port."
          --https.host?=: "HTTPS proxy host."
          --https.port?=: "HTTPS TCP port."
          --socks.host?=: "SOCKS proxy host."
          --socks.port?=: "SOCKS TCP port."
      - name: "ping"
        description: "Describe mock connectivity measurements without sending traffic."
        flags:
          -h, --help: "Show this help message."
          --count?=: "Positive number of simulated requests."
          --timeout?=: "Positive simulated timeout in seconds."
        completion:
          positional:
            - []
  - name: "profile"
    description: "Manage reusable simulated workstation configurations."
    aliases:
      - "preset"
    flags:
      -h, --help: "Show this help message."
    commands:
      - name: "save"
        description: "Describe saving the current simulated configuration."
        flags:
          -h, --help: "Show this help message."
        completion:
          positional:
            - []
      - name: "apply"
        description: "Describe applying a simulated profile."
        flags:
          -h, --help: "Show this help message."
          --force: "Describe simulated force behavior without bypassing safety."
          --only*?=: "Repeatable simulated section to include."
          --except*?=: "Repeatable simulated section to exclude."
        completion:
          positional:
            - []
      - name: "remove"
        description: "Describe removing an in-memory simulated profile."
        flags:
          -h, --help: "Show this help message."
          -f, --force: "Confirm simulated profile removal."
        completion:
          positional:
            - []
      - name: "list"
        description: "List fixed in-memory simulated profiles."
        flags:
          -h, --help: "Show this help message."
